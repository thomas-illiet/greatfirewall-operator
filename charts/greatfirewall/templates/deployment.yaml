apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gfw.name" . }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gfw.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gfw.name" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "gfw.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/config/operator.yaml", "--log-level", {{ .Values.logLevel | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8444
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: token
              mountPath: /secrets/token
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.api.caSecret .Values.mock.enabled }}
            - name: ca
              mountPath: /secrets/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gfw.name" . }}-config
        - name: token
          secret:
            secretName: {{ .Values.api.tokenSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.api.tokenKey }}
                path: token
        - name: tmp
          emptyDir: {}
        {{- if or .Values.api.caSecret .Values.mock.enabled }}
        - name: ca
          secret:
            secretName: {{ default .Values.mock.tlsSecret .Values.api.caSecret }}
            items:
              - key: {{ .Values.api.caKey }}
                path: ca.crt
        {{- end }}
