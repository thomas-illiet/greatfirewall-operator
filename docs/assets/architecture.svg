<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Great Firewall architecture</title>
  <desc id="desc">The operator watches pods, retrieves profiles over HTTPS with a token, maintains a Kubernetes cache, and creates NetworkPolicies enforced by the CNI.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="#475569"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9 0 L0 5 L9 10" fill="#475569"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #172554; }
      .heading { font-size: 29px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .body { font-size: 15px; fill: #475569; }
      .caption { font-size: 13px; fill: #475569; }
      .box { fill: white; stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="35" y="48" class="heading">Great Firewall · architecture</text>
  <text x="35" y="77" class="body">From remote profiles to IPv4 network permissions for pods</text>
  <rect x="30" y="105" width="760" height="565" rx="20" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="50" y="133" class="caption">KUBERNETES CLUSTER · IPv6 disabled by the platform</text>
  <rect x="60" y="160" width="250" height="105" rx="12" class="box"/>
  <text x="80" y="192" class="label">Selected pods</text>
  <text x="80" y="220" class="body">greatfirewall/profile</text>
  <text x="80" y="243" class="body">= profile name</text>
  <rect x="400" y="160" width="350" height="180" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="425" y="195" class="label">Go operator</text>
  <text x="425" y="225" class="body">Watch → validate → reconcile</text>
  <text x="425" y="253" class="body">Cobra · Viper · slog</text>
  <text x="425" y="281" class="body">Refresh interval: 60 seconds</text>
  <text x="425" y="309" class="body">Shared profile per namespace</text>
  <path d="M310 210 H393" class="arrow"/>
  <text x="323" y="199" class="caption">watch</text>
  <rect x="60" y="330" width="250" height="105" rx="12" class="box"/>
  <text x="80" y="362" class="label">Cache · ConfigMaps</text>
  <text x="80" y="390" class="body">Last profile or revocation</text>
  <text x="80" y="413" class="body">Retained across restarts</text>
  <path d="M310 380 H350 V280 H393" class="arrow" marker-start="url(#arrow-start)"/>
  <rect x="60" y="500" width="250" height="105" rx="12" class="box"/>
  <text x="80" y="532" class="label">Mounted Secrets</text>
  <text x="80" y="560" class="body">Token and trusted TLS CA</text>
  <text x="80" y="583" class="body">Token rotation through files</text>
  <path d="M310 550 H375 V320 H393" class="arrow"/>
  <rect x="400" y="410" width="350" height="90" rx="12" class="box"/>
  <text x="425" y="444" class="label">Standard NetworkPolicies</text>
  <text x="425" y="473" class="body">Baseline + profile permissions</text>
  <path d="M575 340 V403" class="arrow"/>
  <text x="590" y="379" class="caption">create / update</text>
  <rect x="400" y="565" width="350" height="75" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="425" y="596" class="label">Cluster CNI</text>
  <text x="425" y="622" class="body">Enforces pod traffic filtering</text>
  <path d="M575 500 V558" class="arrow"/>
  <text x="590" y="539" class="caption">asynchronous enforcement</text>
  <rect x="860" y="160" width="290" height="150" rx="14" class="box"/>
  <text x="883" y="196" class="label">Profiles API</text>
  <text x="883" y="227" class="body">External or mock API</text>
  <text x="883" y="256" class="body">IPv4 / CIDR + TCP/UDP ports</text>
  <text x="883" y="285" class="body">Token required · verified TLS</text>
  <path d="M750 208 H853" class="arrow"/>
  <text x="766" y="195" class="caption">HTTPS</text>
  <path d="M860 270 H757" class="arrow"/>
  <text x="778" y="293" class="caption">profile</text>
  <rect x="860" y="510" width="290" height="130" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text x="883" y="547" class="label">Allowed destinations</text>
  <text x="883" y="577" class="body">Exact IPv4 / port pairs</text>
  <text x="883" y="606" class="body">Cluster DNS for valid profiles</text>
  <path d="M750 600 H853" class="arrow"/>
  <text x="773" y="587" class="caption">IPv4</text>
  <text x="35" y="703" class="caption">A 404 also removes DNS. The platform manages admission and user permissions, and disables IPv6.</text>
</svg>
