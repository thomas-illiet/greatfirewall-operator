apiVersion: v1
kind: Namespace
metadata:
  name: gfw-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targets
  namespace: gfw-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target
  template:
    metadata:
      labels:
        app: target
    spec:
      automountServiceAccountToken: false
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.disable_ipv6
            value: "1"
          - name: net.ipv6.conf.default.disable_ipv6
            value: "1"
      containers:
        - name: http
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo allowed > /www/index.html
              httpd -f -p 8080 -h /www &
              httpd -f -p 8081 -h /www &
              wait
          readinessProbe:
            httpGet:
              path: /
              port: 8080
