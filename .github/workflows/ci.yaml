name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.5
      - name: Install Kubernetes test API
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.35.x)" >> "$GITHUB_ENV"
      - run: make verify build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: reports/
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.5
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - run: go install sigs.k8s.io/kind@v0.31.0
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-evidence
          path: reports/e2e-*
