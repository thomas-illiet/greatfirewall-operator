apiVersion: v1
kind: Pod
metadata:
  name: sandbox
  labels:
    greatfirewall/profile: dev-sandbox
spec:
  automountServiceAccountToken: false
  containers:
    - name: shell
      image: busybox:1.37
      command: [sleep, "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
